name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy Application to Azure VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |

            echo "Fix Git Safe Directory"
            git config --global --add safe.directory /home/ECSL/AMPT-WEB

            echo "Deploy Backend"
            cd /home/ECSL/AMPT-WEB/amsbackend
            git pull origin main
            npm install
            pm2 restart AMPT-backend || pm2 start npm --name AMPT-backend -- start
            pm2 save

            echo "Deploy Frontend"
            cd /home/ECSL/AMPT-WEB/amsfrontend
            git pull origin main
            npm install
            npm run build

            echo "Copy React build to Nginx"
            sudo rm -rf /var/www/html/*
            sudo cp -r build/* /var/www/html/

            echo "Restart Nginx"
            sudo nginx -t
            sudo systemctl restart nginx
