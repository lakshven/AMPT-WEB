name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            git config --global --add safe.directory /home/ECSL/AMPT-WEB

            cd /home/ECSL/AMPT-WEB/amsbackend

            git pull origin main

            npm install

            sudo pm2 restart AMPT-backend || sudo pm2 restart all

            echo "Deploy Frontend"
            cd /home/ECSL/AMPT-WEB/amsfrontend
            git pull origin main
            sudo npm install
            sudo npm run build
            sudo echo "Reload Nginx"
            sudo nginx -t
            sudo systemctl reload nginx
